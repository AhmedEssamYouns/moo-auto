# =========================
# /etc/nginx/nginx.conf
# =========================

worker_processes  auto;

events {
  worker_connections  1024;
  multi_accept on;
}

http {
  # --- Basic sane defaults ---
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 4096;
  server_tokens off;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # --- Logging ---
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # --- Compression: GZIP ---
  gzip on;
  gzip_comp_level 6;                   # 1–9; 6 is a good balance
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_disable "msie6";
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/x-javascript
    application/json application/xml application/rss+xml
    application/manifest+json application/x-web-app-manifest+json
    image/svg+xml
    font/ttf font/otf application/font-woff application/font-woff2;
  gzip_static on;                      # serve *.gz if present

  # --- Brotli (OPTIONAL: uncomment only if your nginx has the module) ---
  # brotli on;
  # brotli_comp_level 5;               # 0–11
  # brotli_static on;                  # serve *.br if present
  # brotli_types
  #   text/plain text/css text/xml text/javascript
  #   application/javascript application/json application/xml
  #   image/svg+xml
  #   font/ttf font/otf application/font-woff2;

  # --- Cache & ETag ---
  etag on;

  # -------------------------
  # Server for Moo Automotive
  # -------------------------
  server {
    listen 80;
    server_name mooautomotive.com dashboard.mooautomotive.com;

    root /usr/share/nginx/html;   # CRA/React build folder
    index index.html;

    # Security headers (basic)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Special files
    location = /sitemap.xml  { default_type application/xml;  try_files $uri =404; }
    location = /robots.txt   { default_type text/plain;       try_files $uri =404; }

    # Do NOT cache the HTML shell (ensures new deploys propagate)
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
      try_files $uri =404;
    }

    # Long-cache immutable assets (hashed filenames)
    location ~* \.(?:css|js|mjs|map|json|woff2?|eot|ttf|svg)$ {
      expires 365d;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Images/Video (already compressed; long cache)
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|mp4)$ {
      expires 365d;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # SPA fallback (after static tries)
    location / {
      try_files $uri /index.html;
    }
  }

  # (Optional) include other vhosts
  # include /etc/nginx/conf.d/*.conf;
}
